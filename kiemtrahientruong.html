<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Kiểm Tra Lưới Điện (GitHub Hosted)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f4f7f6; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px;}
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 10px;}
    button:disabled { background-color: #999; cursor: not-allowed; }
    #statusMsg { font-weight: bold; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <div class="card" id="loginBlock">
    <h2 style="text-align:center; color:#0056b3;">Đăng Nhập Hệ Thống</h2>
    <div class="form-group">
      <label>Tài khoản:</label>
      <input type="text" id="accInput" placeholder="Nhập tài khoản">
    </div>
    <div class="form-group">
      <label>Mật khẩu:</label>
      <input type="password" id="passInput" placeholder="Nhập mật khẩu">
    </div>
    <button id="loginBtn" onclick="handleLogin()">Xác Thực Đầu Vào</button>
  </div>

  <div class="card" id="userInfoBlock" style="display:none; text-align:center; background-color: #e2f0d9;">
    <h3 style="color: #385723;">Đăng Nhập Thành Công</h3>
    <p id="userNameDisplay"></p>
  </div>

  <div id="statusMsg"></div>

  <script>
    // ---------------------------------------------------------
    // CẤU HÌNH API - DÁN URL WEB APP CỦA GOOGLE APPS SCRIPT VÀO ĐÂY
    // ---------------------------------------------------------
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby_XXXXX_YYYYY_ZZZZZ/exec";

    /**
     * Hàm lõi giao tiếp với Backend. 
     * BẮT BUỘC dùng headers text/plain để tránh bị trình duyệt chặn CORS Preflight.
     */
    async function requestBackend(actionName, payloadParams) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          // Mẹo Bypass CORS: GAS xử lý text/plain trơn tru nhất khi gọi chéo tên miền
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: actionName, ...payloadParams })
        });
        
        if (!response.ok) throw new Error("Mất kết nối mạng hoặc Server lỗi.");
        
        return await response.json();
      } catch (error) {
        console.error("API Error:", error);
        return { success: false, error: error.message };
      }
    }

    /**
     * Module: Gửi lệnh Đăng nhập
     */
    async function handleLogin() {
      const btn = document.getElementById("loginBtn");
      const status = document.getElementById("statusMsg");
      const acc = document.getElementById("accInput").value.trim();
      const pass = document.getElementById("passInput").value.trim();

      if (!acc || !pass) {
        status.innerText = "Vui lòng nhập đầy đủ thông tin.";
        status.style.color = "red";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Đang xác thực...";
      status.innerText = "";

      // GỌI API THAY VÌ DÙNG google.script.run
      const result = await requestBackend("loginSystem", { account: acc, passApp: pass });

      btn.disabled = false;
      btn.innerText = "Xác Thực Đầu Vào";

      if (result.success) {
        // UI Logic
        document.getElementById("loginBlock").style.display = "none";
        document.getElementById("userInfoBlock").style.display = "block";
        document.getElementById("userNameDisplay").innerText = 
          "Xin chào: " + result.user.hoTen + " (" + result.user.chucDanh + ")";
        status.innerText = "";
      } else {
        status.innerText = result.message || result.error;
        status.style.color = "red";
      }
    }

    // Tương tự, nếu bạn muốn xuất PDF, bạn gọi: 
    // await requestBackend("exportReportToPDF", { idPhieu: "123456" })
  </script>
</body>
</html>
