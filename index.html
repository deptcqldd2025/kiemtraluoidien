<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDC Field App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div id="loginSection" class="container mt-5">
        <div class="card p-4">
            <h5 class="text-center mb-3">ĐĂNG NHẬP HỆ THỐNG</h5>
            <input type="text" id="loginAccount" class="form-control mb-2" placeholder="Account">
            <input type="password" id="loginPassword" class="form-control mb-3" placeholder="PassApp">
            <button id="btnLogin" class="btn btn-primary w-100" onclick="login()">ĐĂNG NHẬP</button>
        </div>
    </div>

    <div id="mainSection" class="container mt-3 d-none">
        <h4 class="text-center text-primary">ĐÃ ĐĂNG NHẬP THÀNH CÔNG</h4>
        <p id="debugInfo" class="text-muted small"></p>
        <button class="btn btn-danger w-100" onclick="localStorage.clear(); location.reload();">ĐĂNG XUẤT</button>
    </div>

    <script>
        // HÀNG 147: DÁN ĐÚNG LINK WEB APP CỦA ANH VÀO ĐÂY
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwF5pmli_jce4D75Jt0wNSg9j7YmLgH5XIBGJQ0_AsSnsot-iP45IqzBDmecvJb0nAFlA/exec";

        function login() {
            const acc = document.getElementById('loginAccount').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('btnLogin');
            
            btn.innerText = "Đang kết nối...";
            btn.disabled = true;

            fetch(APPS_SCRIPT_URL + "?action=loginapp&account=" + acc + "&password=" + pass)
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        document.getElementById('loginSection').classList.add('d-none');
                        document.getElementById('mainSection').classList.remove('d-none');
                        document.getElementById('debugInfo').innerText = "Chào: " + data.user.hovaten;
                    } else {
                        alert(data.message);
                        btn.innerText = "ĐĂNG NHẬP";
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    alert("Lỗi kết nối: " + err);
                    btn.innerText = "ĐĂNG NHẬP";
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
