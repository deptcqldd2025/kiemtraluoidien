<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Tồn Tại</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .thumb-img { width: 60px; height: 60px; object-fit: cover; cursor: pointer; border-radius: 4px; }
        #fullImg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body class="p-3">

<div class="container">
    <h3>Bảng Tổng Hợp Tồn Tại</h3>
    <select id="lineFilter" class="form-select mb-3" onchange="filterData()">
        <option value="all">Tất cả đường dây</option>
    </select>
    
    <table class="table table-bordered table-striped">
        <thead>
            <tr><th>Trụ</th><th>Hạng Mục</th><th>Ghi Chú</th><th>Hình Ảnh</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div id="fullImg" onclick="this.style.display='none'">
    <img id="imgView" style="max-width:90%; max-height:90%;">
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwF5pmli_jce4D75Jt0wNSg9j7YmLgH5XIBGJQ0_AsSnsot-iP45IqzBDmecvJb0nAFlA/exec?action=getDashboardData";
let allData = [];

fetch(SCRIPT_URL).then(res => res.json()).then(data => {
    allData = data;
    renderTable(data);
    let lines = [...new Set(data.map(item => item.MaViTri.split('_')[0]))]; // Giả sử MaViTri chứa ID đường dây
    lines.forEach(l => document.getElementById('lineFilter').innerHTML += `<option value="${l}">${l}</option>`);
});

function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = data.filter(d => d.KetQua === "Có tồn tại").map(d => `
        <tr>
            <td>${d.MaViTri}</td>
            <td>${d.HangMucChinh}</td>
            <td>${d.GhiChu}</td>
            <td><img src="${d.LinkHinhAnh.split('\n')[0]}" class="thumb-img" onclick="viewImg(this.src)"></td>
        </tr>
    `).join('');
}

function filterData() {
    let val = document.getElementById('lineFilter').value;
    renderTable(val === 'all' ? allData : allData.filter(d => d.MaViTri.startsWith(val)));
}

function viewImg(src) {
    document.getElementById('imgView').src = src;
    document.getElementById('fullImg').style.display = 'flex';
}
</script>
</body>
</html>
